[package]
name = "github-webhook-listener"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Alexandru Nedelcu"]
license = "AGPL-3.0"
description = "A simple web app that can be registered as a GitHub Webhook and trigger shell commands in response to events"

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
hocon-rs = "0.2"

# Cryptography for HMAC
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4.6", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time parsing
humantime = "2.4"
iso8601-duration = "0.2"
nix = { version = "0.31", features = ["signal", "process"] }

# HTML rendering
askama = "0.16"

[dev-dependencies]
tempfile = "3.27"
reqwest = { version = "0.13", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
